name: Build Baldi Rust IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Extract Rust project
        run: |
          unzip -q baldi-rs.zip -d work
          PROJECT=$(find work -name Cargo.toml -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust library
        run: |
          cd "$PROJECT_DIR"
          cargo build --release --target aarch64-apple-ios --lib

      - name: Create iOS app
        run: |
          mkdir -p Payload/Baldi.app

          cat > ios_main.swift <<'SWIFT'
          import UIKit

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions options:
                  [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = UIViewController()
                  window?.rootViewController?.view.backgroundColor = .black
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT

          swiftc -target arm64-apple-ios13.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -framework UIKit \
            ios_main.swift \
            -o Payload/Baldi.app/Baldi

          cat > Payload/Baldi.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Baldi</string>
              <key>CFBundleIdentifier</key>
              <string>com.baldi.rust</string>
              <key>CFBundleName</key>
              <string>Baldi</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.3.0</string>
              <key>MinimumOSVersion</key>
              <string>13.0</string>
          </dict>
          </plist>
          PLIST

          cp "$PROJECT_DIR/target/aarch64-apple-ios/release/libbaldi_plus_rust.a" \
             Payload/Baldi.app/libbaldi_plus_rust.a

          chmod +x Payload/Baldi.app/Baldi
          codesign --force --sign - Payload/Baldi.app/Baldi
          codesign --force --sign - Payload/Baldi.app

          mkdir -p ipa-output
          ditto -c -k --sequesterRsrc --keepParent Payload ipa-output/Baldi.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Baldi-IPA
          path: ipa-output/Baldi.ipa
