name: build-ios
on:
  workflow_dispatch:
  
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q baldi-rs.zip -d work
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work/baldi-rs
      - name: Build Rust (iOS static lib)
        working-directory: work/baldi-rs
        run: cargo build --release --target aarch64-apple-ios --lib 2>&1 | tee ../../build.log
      - name: Package unsigned IPA
        working-directory: work/baldi-rs
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/Baldi.app
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            ios/main.m target/aarch64-apple-ios/release/libbaldi_rs.a \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -framework Metal -framework MetalKit -framework AudioToolbox -framework CoreAudio \
            -framework AVFoundation -framework CoreFoundation -framework Security \
            -framework CoreMedia -framework CoreMotion -framework CoreText -framework CoreVideo \
            -framework GameController -framework IOKit -framework OpenGLES \
            -lc++ -lresolv -lobjc \
            -o Payload/Baldi.app/Baldi 2>&1 | tee -a ../../build.log
          cp ios/Info.plist Payload/Baldi.app/Info.plist
          zip -qr ../../Baldi.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Baldi-ipa
          path: Baldi.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
