
name: Build Baldi Rust for iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q baldi-rs.zip -d work
          PROJECT=$(find work -name Cargo.toml -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work

      - name: Clear build cache
        run: |
          cd "$PROJECT_DIR"
          cargo clean


      - name: Check Rust
        run: |
          cd "$PROJECT_DIR"
          cargo check
          cargo test

      - name: Build for iPhone
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          cargo build --release --target aarch64-apple-ios --lib \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload Rust build
        uses: actions/upload-artifact@v4
        with:
          name: baldi-rust-ios
          path: |
            ${{ env.PROJECT_DIR }}/target/aarch64-apple-ios/release/
            build.log
