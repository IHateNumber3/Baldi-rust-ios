name: build-from-zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q baldi-rs.zip -d work
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work/baldi-rs
      - name: Build
        working-directory: work/baldi-rs
        run: cargo build --release 2>&1 | tee ../../build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
