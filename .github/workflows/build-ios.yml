name: Build Baldi Rust iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          test -f baldi-rs.zip
          unzip -tq baldi-rs.zip

          mkdir -p work
          unzip -q baldi-rs.zip -d work

          PROJECT=$(find work -type f -name Cargo.toml -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Cargo.toml not found!"
            find work -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check Rust project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"

          cargo check --lib
          cargo test --lib

      - name: Build Rust for iPhone
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"

          cargo build \
            --release \
            --target aarch64-apple-ios \
            --lib

          test -f target/aarch64-apple-ios/release/libbaldi_plus_rust.a

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR/ios-host"
          xcodegen generate

      - name: Build iOS application
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR/ios-host"

          xcodebuild \
            -project Baldi.xcodeproj \
            -scheme Baldi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP=$(find "$PROJECT_DIR/ios-host/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -print -quit)

          test -n "$APP"
          test -d "$APP"

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry Baldi.ipa Payload

          test -s Baldi.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Baldi-iOS-IPA
          path: ipa/Baldi.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Baldi-build-logs
          path: |
            ${{ env.PROJECT_DIR }}/ios-host/build/Logs/
            ${{ env.PROJECT_DIR }}/target/
          if-no-files-found: ignore
